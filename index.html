<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusPay PTC - Earn & Withdraw</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(23, 32, 54, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --accent: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at top right, #1e1b4b, #090d16 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-badge { display: inline-block; padding: 5px 12px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--primary); border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-size: 24px; font-weight: 800; color: #fff; }
    p.subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

    .input-group { margin-bottom: 16px; text-align: left; }
    label { font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }

    .dashboard { display: none; }
    .user-banner { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.5); padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; border: 1px solid var(--card-border); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-card { background: rgba(15, 23, 42, 0.7); padding: 14px; border-radius: 14px; border: 1px solid var(--card-border); text-align: left; }
    .stat-card small { color: var(--text-muted); font-size: 11px; display: block; margin-bottom: 4px; }
    .stat-card .val { font-size: 18px; font-weight: 800; color: var(--accent); }

    .ad-card { background: rgba(30, 41, 59, 0.6); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .ad-title { font-size: 14px; font-weight: 700; }
    .ad-reward { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 2px; }

    .btn-ad { padding: 8px 14px; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4); color: var(--primary); border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .btn-ad:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #0f172a; border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; text-align: center; }
    .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 16px 0; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 1s linear; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LOGIN VIEW -->
    <div id="loginView">
      <div class="brand-header">
        <span class="brand-badge">PTC Earning Portal</span>
        <h1>NexusPay 🚀</h1>
        <p class="subtitle">Watch ads & withdraw via JazzCash / EasyPaisa</p>
      </div>

      <div class="input-group">
        <label>Enter Email</label>
        <input type="email" id="userEmail" placeholder="e.g. user@gmail.com" />
      </div>

      <button class="btn-primary" onclick="enterDashboard()">Login / Register</button>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="dashboard">
      <div class="user-banner">
        <div><small style="color:var(--text-muted)">User:</small> <span id="displayUser" style="font-weight:700"></span></div>
        <span style="color:var(--accent); font-weight:700;">● Online</span>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <small>Balance</small>
          <div class="val">Rs. <span id="totalBalance">0</span></div>
        </div>
        <div class="stat-card">
          <small>Ads Watched</small>
          <div class="val" style="color: var(--primary)" id="adsCount">0</div>
        </div>
      </div>

      <div style="font-size:14px; font-weight:700; margin-bottom:10px; text-align:left;">Available Sponsor Ads</div>

      <div class="ad-card">
        <div>
          <div class="ad-title">Sponsor Ad #1</div>
          <div class="ad-reward">+ Rs. 15.00</div>
        </div>
        <button class="btn-ad" id="ad1" onclick="startAd(1, 15)">Watch (5s)</button>
      </div>

      <div class="ad-card">
        <div>
          <div class="ad-title">Sponsor Ad #2</div>
          <div class="ad-reward">+ Rs. 25.00</div>
        </div>
        <button class="btn-ad" id="ad2" onclick="startAd(2, 25)">Watch (5s)</button>
      </div>

      <button class="btn-primary" style="margin-top: 15px; background: #16a34a;" onclick="openWithdrawModal()">Withdraw Funds 💳</button>
    </div>

  </div>

  <!-- AD TIMER MODAL -->
  <div class="modal" id="adModal">
    <div class="modal-content">
      <h3>Watching Sponsor Ad</h3>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div id="countdown" style="font-size: 22px; font-weight: 800; color: var(--primary);">5s</div>
    </div>
  </div>

  <!-- WITHDRAW MODAL -->
  <div class="modal" id="withdrawModal">
    <div class="modal-content" style="text-align: left;">
      <h3 style="margin-bottom: 12px; text-align: center;">Request Withdrawal</h3>
      
      <div class="input-group">
        <label>Payment Method</label>
        <select id="payMethod">
          <option value="JazzCash">JazzCash</option>
          <option value="EasyPaisa">EasyPaisa</option>
        </select>
      </div>

      <div class="input-group">
        <label>Account Mobile Number</label>
        <input type="text" id="accNumber" placeholder="03001234567" />
      </div>

      <div class="input-group">
        <label>Account Title Name</label>
        <input type="text" id="accName" placeholder="e.g. Haider Ali" />
      </div>

      <button class="btn-primary" onclick="submitWithdraw()">Submit Request</button>
      <button class="btn-primary" style="margin-top: 8px; background: transparent; border: 1px solid var(--card-border);" onclick="closeWithdrawModal()">Cancel</button>
    </div>
  </div>

  <script>
    let currentUser = "";
    let balance = 0;
    let completedCount = 0;

    function enterDashboard() {
      const email = document.getElementById('userEmail').value.trim();
      if(!email || !email.includes('@')) {
        alert('Please enter a valid email address!');
        return;
      }
      currentUser = email;
      
      const savedBalance = localStorage.getItem('ptc_bal_' + currentUser);
      if(savedBalance) {
        balance = parseFloat(savedBalance);
      }

      document.getElementById('displayUser').innerText = email.split('@')[0];
      document.getElementById('totalBalance').innerText = balance;
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
    }

    function startAd(id, reward) {
      const modal = document.getElementById('adModal');
      const progress = document.getElementById('progressFill');
      const countdown = document.getElementById('countdown');
      const btn = document.getElementById('ad' + id);

      modal.style.display = 'flex';
      progress.style.width = '0%';
      let timeLeft = 5;

      let timer = setInterval(() => {
        timeLeft--;
        progress.style.width = ((5 - timeLeft) * 20) + '%';
        countdown.innerText = timeLeft + 's';

        if(timeLeft <= 0) {
          clearInterval(timer);
          setTimeout(() => {
            modal.style.display = 'none';
            balance += reward;
            completedCount++;
            localStorage.setItem('ptc_bal_' + currentUser, balance);
            document.getElementById('totalBalance').innerText = balance;
            document.getElementById('adsCount').innerText = completedCount;
            btn.innerText = 'Completed ✅';
            btn.disabled = true;
          }, 300);
        }
      }, 1000);
    }

    function openWithdrawModal() {
      if(balance < 50) {
        alert('Minimum payout limit is Rs. 50. Watch more ads to earn!');
        return;
      }
      document.getElementById('withdrawModal').style.display = 'flex';
    }

    function closeWithdrawModal() {
      document.getElementById('withdrawModal').style.display = 'none';
    }

    function submitWithdraw() {
      const num = document.getElementById('accNumber').value.trim();
      const name = document.getElementById('accName').value.trim();
      const method = document.getElementById('payMethod').value;

      if(!num || !name) {
        alert('Please fill out account details correctly!');
        return;
      }

      alert(`Withdrawal Request Submitted! 🎉\n\nMethod: ${method}\nAccount: ${num}\nName: ${name}\nAmount: Rs. ${balance}\n\nYour request will be processed within 24 hours.`);
      
      balance = 0;
      localStorage.setItem('ptc_bal_' + currentUser, 0);
      document.getElementById('totalBalance').innerText = 0;
      closeWithdrawModal();
    }
  </script>
</body>
</html>
