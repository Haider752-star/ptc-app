<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusPay - Forest Glass Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* Forest dark aesthetic gradient background */
      background: linear-gradient(rgba(10, 20, 30, 0.75), rgba(5, 12, 20, 0.88)), 
                  url('https://images.unsplash.com/photo-1511497584788-87676111168f?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
    }

    /* GLASS CARD MATCHING YOUR IMAGE */
    .glass-box {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    .glass-box h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .glass-box p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      margin-bottom: 25px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    .input-field::placeholder { color: rgba(255, 255, 255, 0.5); }

    .input-field:focus {
      border-color: #38bdf8;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
    }

    .btn-submit:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .dashboard-view { display: none; text-align: left; }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 14px;
      border-radius: 12px;
    }

    .stat-card small { color: rgba(255, 255, 255, 0.6); font-size: 11px; display: block; font-weight: 600; }
    .stat-card .val { font-size: 18px; font-weight: 800; color: #4ade80; margin-top: 2px; }

    .ad-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ad-btn {
      padding: 8px 14px;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .ad-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin: 16px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 1s linear;
    }
  </style>
</head>
<body>

  <div class="glass-box">
    
    <!-- LOGIN VIEW -->
    <div id="loginView">
      <h2>Login</h2>
      <p>Enter your details to open dashboard</p>

      <input type="email" id="email" class="input-field" placeholder="Email address" />
      <input type="password" id="password" class="input-field" placeholder="Password" />

      <button class="btn-submit" onclick="doLogin()">Login</button>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="dashboard-view">
      <h2 style="font-size:22px; text-align:center;">Dashboard</h2>
      <p style="text-align:center; margin-bottom:15px;">Welcome back, <span id="userDisp" style="color:#38bdf8; font-weight:700;"></span></p>

      <div class="stat-row">
        <div class="stat-card">
          <small>Balance</small>
          <div class="val">Rs. <span id="bal">0</span></div>
        </div>
        <div class="stat-card">
          <small>Ads Watched</small>
          <div class="val" style="color:#38bdf8;" id="adsCount">0</div>
        </div>
      </div>

      <div style="font-size:13px; font-weight:700; margin-bottom:10px; color:rgba(255,255,255,0.8);">Sponsor Ads</div>

      <div class="ad-card">
        <div>
          <div style="font-size:14px; font-weight:700;">Sponsor Ad #1</div>
          <div style="font-size:12px; color:#4ade80;">+ Rs. 15.00</div>
        </div>
        <button class="ad-btn" id="ad1" onclick="watchAd(1, 15)">Watch (5s)</button>
      </div>

      <div class="ad-card">
        <div>
          <div style="font-size:14px; font-weight:700;">Sponsor Ad #2</div>
          <div style="font-size:12px; color:#4ade80;">+ Rs. 25.00</div>
        </div>
        <button class="ad-btn" id="ad2" onclick="watchAd(2, 25)">Watch (5s)</button>
      </div>

      <button class="btn-submit" style="background:#16a34a; margin-top:12px;" onclick="openWithdraw()">Withdraw Funds 💳</button>
    </div>

  </div>

  <!-- AD MODAL -->
  <div class="modal" id="adModal">
    <div class="modal-box">
      <h3>Watching Sponsor Ad...</h3>
      <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
      <div id="timer" style="font-size:22px; font-weight:800; color:#38bdf8;">5s</div>
    </div>
  </div>

  <!-- WITHDRAW MODAL -->
  <div class="modal" id="withdrawModal">
    <div class="modal-box" style="text-align:left;">
      <h3 style="text-align:center; margin-bottom:14px;">Withdraw Funds</h3>
      
      <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:4px;">Method</label>
      <select id="method" class="input-field">
        <option value="JazzCash">JazzCash</option>
        <option value="EasyPaisa">EasyPaisa</option>
      </select>

      <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:4px;">Mobile Number</label>
      <input type="text" id="accNo" class="input-field" placeholder="03001234567" />

      <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:4px;">Account Title</label>
      <input type="text" id="accName" class="input-field" placeholder="Account Holder Name" />

      <button class="btn-submit" onclick="submitPayout()">Submit Request</button>
      <button class="btn-submit" style="background:transparent; border:1px solid rgba(255,255,255,0.2); margin-top:8px;" onclick="closeWithdraw()">Cancel</button>
    </div>
  </div>

  <script>
    let uEmail = "";
    let uBal = 0;
    let totalWatched = 0;

    function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();

      if(!email || !email.includes('@')) {
        alert('Please enter a valid email address!');
        return;
      }
      if(!pass) {
        alert('Please enter password!');
        return;
      }

      uEmail = email;
      const saved = localStorage.getItem('forest_bal_' + uEmail);
      if(saved) uBal = parseFloat(saved);

      document.getElementById('userDisp').innerText = email.split('@')[0];
      document.getElementById('bal').innerText = uBal;
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
    }

    function watchAd(id, reward) {
      const modal = document.getElementById('adModal');
      const fill = document.getElementById('pFill');
      const timer = document.getElementById('timer');
      const btn = document.getElementById('ad' + id);

      modal.style.display = 'flex';
      fill.style.width = '0%';
      let time = 5;

      let interval = setInterval(() => {
        time--;
        fill.style.width = ((5 - time) * 20) + '%';
        timer.innerText = time + 's';

        if(time <= 0) {
          clearInterval(interval);
          setTimeout(() => {
            modal.style.display = 'none';
            uBal += reward;
            totalWatched++;
            localStorage.setItem('forest_bal_' + uEmail, uBal);
            document.getElementById('bal').innerText = uBal;
            document.getElementById('adsCount').innerText = totalWatched;
            btn.innerText = 'Completed ✅';
            btn.disabled = true;
          }, 300);
        }
      }, 1000);
    }

    function openWithdraw() {
      if(uBal < 50) {
        alert('Minimum payout limit is Rs. 50!');
        return;
      }
      document.getElementById('withdrawModal').style.display = 'flex';
    }

    function closeWithdraw() {
      document.getElementById('withdrawModal').style.display = 'none';
    }

    function submitPayout() {
      const no = document.getElementById('accNo').value.trim();
      const name = document.getElementById('accName').value.trim();
      const method = document.getElementById('method').value;

      if(!no || !name) {
        alert('Please fill out all details!');
        return;
      }

      alert(`Request Submitted! 🎉\nMethod: ${method}\nAccount: ${no}\nAmount: Rs. ${uBal}`);
      uBal = 0;
      localStorage.setItem('forest_bal_' + uEmail, 0);
      document.getElementById('bal').innerText = 0;
      closeWithdraw();
    }
  </script>
</body>
</html>
